# How to run: the TEMPLATE for the work machine and its own data. DO NOT edit this file: COPY it to a NEW name first, fill in every `<<< ... >>>` marker in the copy, then use the copy (PowerShell, project folder, `$env:PYTHONPATH = "src"`):
#     Copy-Item configs\work.yaml configs\my_work.yaml          # the copy is the file you edit (the release manifest lists configs\work.yaml itself, so it must stay unchanged: O110)
#     python -m stt check   --config configs\my_work.yaml       # lists EVERY problem at once; the markers below show up as `PROBLEM ... <<< ... >>>` until you replace them
#     python -m stt prepare --config configs\my_work.yaml       # reads, validates, splits, normalizes and filters the data, writes the reports; see docs/DATA_ONBOARDING.md
#     python -m stt benchmark --config configs\my_work.yaml     # then `run` (see docs/RUNBOOK.md)
# The paths, the model and the column names are the ONLY things that must be filled in; the training values below start from the home preset and are to be tuned after `benchmark` has measured THIS machine (O66).
extends: base.yaml

data:
  source:
    type: csv                    # csv = a folder with manifest.csv and the audio; hf_parquet = a folder of Hugging Face parquet files
    path: "<<< FILL IN: the folder with the audio files and manifest.csv (or the parquet files) >>>"
  columns:
    audio: "<<< FILL IN: the manifest column with the audio file name >>>"
    text: "<<< FILL IN: the manifest column with the transcript >>>"
    group: "<<< FILL IN: the manifest column with the recording / lesson / speaker id that must never be split between Train and Test >>>"
  group_fallback: fail           # leave it: a missing group column stops the run on purpose (leakage protection)
model:
  path: "<<< FILL IN: the folder of the base model on this machine, for example models\\whisper-tiny >>>"
run:
  experiments_dir: experiments
registry:
  dir: registry
train:
  cpu_threads: 2                 # set it to what this machine has; `benchmark` prints the time per step for this number
  hyperparams:
    max_steps: 100
    warmup_steps: 3              # keep it at 3 or less: `benchmark` trains only 3 steps and fails when the warmup is longer (O119)
    batch_size: 2
    grad_accum_steps: 2
  log_every_steps: 10
  eval_every_steps: 50
  save_every_steps: 100
eval:
  batch_size: 4
search:
  n_trials: 4
  parameters:
    learning_rate: {kind: log_float, low: 5.0e-6, high: 5.0e-5, points: 4}
  pruning:
    enabled: false
  finalists:
    k: 2
progress:
  interval_seconds: 30
report:
  target_relative_wer_reduction: 0.10   # the target: a Val WER at least 10% below the baseline of the same Val set (no floor)
