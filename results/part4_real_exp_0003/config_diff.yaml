# difference from the defaults of the config schemas
data:
  source:
    type: hf_parquet
    path: data\daf_yomi_raw
  columns:
    id: null
    audio: audio
    text: transcript
    group: meta_entry_id
    split: source_split
  extra_types:
    meta_seek: float
    meta_duration: float
    meta_quality_score: float
    meta_number_of_segments: int
    meta_bad_segments: int
    meta_golden_segments: bool
    has_prev: bool
    has_timestamps: bool
  extract:
    dir: data\extracted\daf_yomi
model:
  path: models\whisper-tiny
run:
  experiments_dir: C:\Users\9090\Desktop\Work\stt-pipeline\data\part4_real\experiments
search:
  parameters:
    learning_rate:
      low: 1.0e-05
      points: 2
    grad_accum_steps:
      choices:
      - 1
      - 2
  n_trials: 2
  pruning:
    enabled: false
subsample:
  val_samples: 100
train:
  hyperparams:
    max_steps: 4
    batch_size: 2
    grad_accum_steps: 2
    warmup_steps: 0
  log_every_steps: 1
  eval_every_steps: 2
  save_every_steps: 4
  cpu_threads: 2
